# Local development stack. Production runs the same images on ECS/Fargate (docs/03-architecture.md §9).
services:
  app:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: easyhealthcare
      DB_USERNAME: ehc
      DB_PASSWORD: ehc_pass
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
    ports: ['8000:8000']
    depends_on: [mysql, redis]
    command: php artisan serve --host=0.0.0.0 --port=8000

  worker:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: backend/.env
    environment: { DB_CONNECTION: mysql, DB_HOST: mysql, DB_DATABASE: easyhealthcare, DB_USERNAME: ehc, DB_PASSWORD: ehc_pass, REDIS_HOST: redis, QUEUE_CONNECTION: redis }
    command: php artisan queue:work --queue=critical,notifications,default --tries=3
    depends_on: [mysql, redis]

  scheduler:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: backend/.env
    environment: { DB_CONNECTION: mysql, DB_HOST: mysql, DB_DATABASE: easyhealthcare, DB_USERNAME: ehc, DB_PASSWORD: ehc_pass, REDIS_HOST: redis, QUEUE_CONNECTION: redis }
    command: php artisan schedule:work
    depends_on: [mysql, redis]

  reverb:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: backend/.env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ['8080:8080']

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ['./frontend:/app']
    environment: { API_URL: 'http://app:8000' }
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ['5173:5173']

  mysql:
    image: mysql:8.0
    environment: { MYSQL_DATABASE: easyhealthcare, MYSQL_USER: ehc, MYSQL_PASSWORD: ehc_pass, MYSQL_ROOT_PASSWORD: root }
    ports: ['3306:3306']
    volumes: ['mysql-data:/var/lib/mysql']

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['8025:8025']

volumes:
  mysql-data:
